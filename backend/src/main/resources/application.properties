spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/fuan}
spring.datasource.username=${DATABASE_USER:fuan}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.flyway.enabled=true
server.port=${PORT:8080}
server.error.include-message=never
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
fuan.admin.username=${ADMIN_USERNAME:}
fuan.admin.password=${ADMIN_PASSWORD:}
fuan.wechat.appid=${WECHAT_APPID:}
fuan.wechat.secret=${WECHAT_SECRET:}
fuan.storage=${ATTACHMENT_PATH:./private-attachments}
xq.allowed-origins=${XQ_ALLOWED_ORIGINS:https://nong.cloud,https://m.nong.cloud,https://work.nong.cloud,https://nc.nong.cloud,https://api.nong.cloud,https://xiangqiao.ltd}
xq.cookie-secure=${XQ_COOKIE_SECURE:true}
xq.local-bootstrap=${XQ_LOCAL_BOOTSTRAP:false}
xq.local-password=${XQ_LOCAL_PASSWORD:}
spring.flyway.url=${FLYWAY_DATABASE_URL:${spring.datasource.url}}
spring.flyway.user=${FLYWAY_DATABASE_USER:${spring.datasource.username}}
spring.flyway.password=${FLYWAY_DATABASE_PASSWORD:${spring.datasource.password}}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.connection-init-sql=SET statement_timeout = '10s'
server.address=${SERVER_ADDRESS:127.0.0.1}
server.max-http-request-header-size=16KB
# Validate the original decimal value, not a lossy intermediate IEEE-754 double.
spring.jackson.deserialization.use-big-decimal-for-floats=true
