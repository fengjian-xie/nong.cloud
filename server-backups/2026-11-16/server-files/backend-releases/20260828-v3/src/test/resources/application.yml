spring:
  datasource:
    url: jdbc:h2:mem:xiangqiao;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  flyway:
    locations: classpath:db/migration/common
app:
  security:
    jwt-secret: "${JWT_SECRET}"
    data-secret: "${DATA_SECRET}"
    token-ttl: PT1H
  integration:
    mode: mock
