<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>乡桥县域运营管理后台</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="login" class="login-shell">
  <section class="brand-panel">
    <div class="brand-mark">乡桥</div>
    <p class="eyebrow">XIANGQIAO COUNTY OPERATIONS</p>
    <h1>把县域农业服务<br>真正组织起来</h1>
    <p>一个后台管理会员、地块、资源、农事服务、供需撮合与外部同步。</p>
  </section>
  <form id="loginForm" class="login-card">
    <p class="eyebrow green">运营人员入口</p><h2>登录管理后台</h2>
    <label>县域<select id="county"><option value="350981">福建省 / 宁德市 / 福安市</option></select></label>
    <label>手机号<input id="mobile" inputmode="numeric" autocomplete="username" placeholder="请输入管理员手机号" required></label>
    <label>密码<input id="password" type="password" autocomplete="current-password" placeholder="请输入密码" required></label>
    <p id="loginError" class="error"></p><button class="primary" type="submit">进入运营工作台</button>
    <small>账号及权限由乡桥平台或本县域运营负责人开通。</small>
  </form>
</div>

<div id="app" class="app-shell hidden">
  <aside>
    <div class="logo"><span>乡桥</span><small>县域运营后台</small></div>
    <nav id="nav">
      <button data-view="dashboard" class="active">经营总览</button>
      <button data-view="memberships">入驻审核</button>
      <button data-view="resources">生产资源</button>
      <button data-view="service-requests">农事需求</button>
      <button data-view="work-orders">服务工单</button>
      <button data-view="supplies">供应信息</button>
      <button data-view="purchases">采购需求</button>
      <button data-view="integrations">同步任务</button>
      <button data-view="audit">审计日志</button>
    </nav>
    <div class="aside-foot"><span id="countyName">福安市</span><button id="logout">退出</button></div>
  </aside>
  <main>
    <header><div><p id="crumb" class="eyebrow green">福安市 · 经营总览</p><h2 id="pageTitle">早上好，运营伙伴</h2></div><div class="status"><i></i>系统运行正常</div></header>
    <section id="content"><div class="loading">正在读取县域数据…</div></section>
  </main>
</div>
<script src="/app.js"></script>
</body>
</html>
